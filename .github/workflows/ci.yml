name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libasound2-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (library features + mimalloc)
        run: cargo clippy --all-targets --features ci-all,allocator-mimalloc -- -D warnings

      - name: Clippy (library features + jemalloc)
        run: cargo clippy --all-targets --features ci-all,allocator-jemalloc -- -D warnings

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --no-default-features --lib -- -D warnings

      - name: Documentation
        run: cargo doc --no-deps --features ci-all

      - name: Tests (library features)
        run: cargo test --features ci-all

      - name: Tests (default features)
        run: cargo test

      - name: Tests (no default features)
        run: cargo test --no-default-features --lib
