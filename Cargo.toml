[package]
name = "waywi"
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
authors = ["Varasina Farmadani <sina@sinanonym.my.id>"]
description = "Wayland widget toolkit in Rust"
repository = "https://github.com/sinavarasina/waywi"
documentation = "https://docs.rs/waywi"
license = "MIT"
readme = "README.md"
keywords = ["wayland", "widgets", "toolkit", "layer-shell", "desktop"]
categories = ["gui", "os::linux-apis"]
exclude = [".github/", "target/"]

[package.metadata.docs.rs]
features = [
    "renderer-software",
    "renderer-gpu",
    "text",
    "image-png",
    "image-svg",
    "image-gif",
    "image-webp",
    "animation",
    "fractional-scale",
    "clipboard",
    "idle-notify",
    "ime",
    "control-ipc",
    "hyprland-ipc",
    "sway-ipc",
    "dbus",
    "global-shortcuts",
    "accessibility",
    "audio-playback",
]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = [
    "renderer-software",
    "text",
    "image-png",
    "animation",
]
renderer-software = ["dep:tiny-skia"]
renderer-gpu = ["dep:femtovg", "dep:wgpu", "wayland-client/system", "wayland-client/dlopen"]
text = ["dep:cosmic-text", "dep:fontdb"]
image-png = ["dep:png"]
image-svg = ["dep:resvg"]
image-gif = ["dep:gif"]
image-webp = ["dep:image-webp"]
animation = []
fractional-scale = ["dep:wayland-protocols"]
clipboard = ["dep:wayland-protocols", "dep:wayland-protocols-wlr"]
idle-notify = ["dep:wayland-protocols"]
ime = ["dep:wayland-protocols"]
control-ipc = ["calloop/signals"]
hyprland-ipc = ["dep:serde", "dep:serde_json"]
sway-ipc = ["dep:serde", "dep:serde_json"]
dbus = ["dep:zbus", "dep:futures-lite", "dep:serde"]
global-shortcuts = ["dbus"]
accessibility = ["dep:accesskit", "dep:accesskit_unix"]
pipewire = ["dep:pipewire"]
pulseaudio = ["dep:libpulse-binding"]
alsa = ["dep:alsa"]
audio-playback = ["dep:rodio"]

[dependencies]
bitflags = "2.11"
bumpalo = "3.19"
calloop = "0.14"
calloop-wayland-source = "0.4"
libc = "0.2"
memmap2 = "0.9"
rustix = { version = "1.0", features = ["fs", "event", "mm", "net", "process"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
xkbcommon = "0.8"

tiny-skia = { version = "0.12", optional = true }
femtovg = { version = "0.28", optional = true, default-features = false, features = ["wgpu"] }
wgpu = { version = "30.0", optional = true, default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
cosmic-text = { version = "0.19", optional = true, default-features = false, features = ["std", "swash", "fontconfig"] }
fontdb = { version = "0.23", optional = true, default-features = false, features = ["std", "memmap", "fontconfig"] }
png = { version = "0.18", optional = true }
resvg = { version = "0.47", optional = true, default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
gif = { version = "0.14", optional = true }
image-webp = { version = "0.2", optional = true }
wayland-protocols = { version = "0.32", optional = true, features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", optional = true, features = ["client"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
zbus = { version = "5.18", optional = true, default-features = false, features = ["async-io", "blocking-api"] }
futures-lite = { version = "2.6", optional = true }
accesskit = { version = "0.25", optional = true }
accesskit_unix = { version = "0.24", optional = true }
pipewire = { version = "0.10", optional = true, features = ["v1_0_0"] }
libpulse-binding = { version = "2.30", optional = true }
alsa = { version = "0.11", optional = true }
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "wav", "vorbis", "mp3", "flac"] }

[dev-dependencies]
criterion = "0.8"
wayland-protocols = { version = "0.32", features = ["server", "staging", "unstable"] }
wayland-server = "0.31"

[[bench]]
name = "render-primitives"
path = "benches/render-primitives.rs"
harness = false

[[bench]]
name = "event-dispatch"
path = "benches/event-dispatch.rs"
harness = false
